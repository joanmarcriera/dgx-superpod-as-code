[project]
name = "dgxnb"
version = "0.1.0"
description = "DGX SuperPOD modelled in NetBox as infrastructure-as-code"
requires-python = ">=3.9"
dependencies = ["pynetbox>=7.4", "pyyaml>=6.0", "requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgxnb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/blender"      # tests/blender/* run inside Blender (bpy), see blender/README.md
