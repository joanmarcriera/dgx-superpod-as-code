# ---------------------------------------------------------------------------------------
# GB300 NVL72 pod (reference/compute-dgx-gb300/README.md "Blender modelling notes"). Tray and
# shelf sizes are Lenovo's for the same MGX family: NVIDIA publishes none for DGX-branded trays.

nvl72_rack:                             # NVIDIA MGX / ORV3-derived 48 RU rack, GB200/GB300 NVL72
  size: [600, 2236, 1068]               # LUG p.6, HC25, Cheval agree; Lenovo LP says 2294 H (unexplained)
  rear_extension_frame_depth: 132       # bolt-on; overall depth 1200 with it
  u1_from_floor: NOT FOUND              # base/plinth height not published; ~4 RU of blank filler sit below the lower shelves
  rails: {width_in: 19, pitch_mm: 44.45, ru: 48, colour: "#9A9DA0"}   # 19" EIA full-length rails on an OCP ORV3 frame (NOT 21" OU)
  body: {colour: "#1E1E20", finish: satin black powder coat, roughness: 0.5}   # est
  doors: none                           # side panels + black rear "bezel" (cable-management fingers); seismic-bracing wedge plinth
  elevation_top_down: >
    ~2 RU blank; 2 x SN2201 (champagne shroud); 4 x power shelf; 10 x compute tray; 9 x NVLink switch
    tray; 8 x compute tray; leakage drip pan; 4 x power shelf; ~4 RU blank filler.
    27 RU of trays contiguous (NVIDIA figure + Hot Chips 2025 + Lenovo LUG Fig 11 agree). Absolute U numbers NOT FOUND.
  busbar: {count: 1, rating: "1400 A / 50 V DC", x_frac_from_rear: 0.50, width_mm: "~36 (est from LUG Fig 12)", depth_mm: NOT FOUND, colour: "#2A2A2C"}
  manifolds: >
    2 vertical blind-mate, stainless per Lenovo spec (black in NVIDIA renders); from the rear the LEFT
    one is return/hot (x ~0.11), the RIGHT one supply/cold (x ~0.885) (inferred from tray QD sides); bottom-feed
    puts 4 large FD83 hose connectors at y 0.84-0.97. Pipe diameter NOT FOUND.
  cable_cartridges: "4 vertical, two each side of the busbar, spanning the 27 RU tray block (x 0.12-0.88, y 0.24-0.76 of rack height)"
  weight_kg: {structure: 185, full_solution: "~1580 (Lenovo, dry/wet NOT stated)"}
  refs: [compute-dgx-gb300/media/nvidia-dgx-gb300-rack-front-elevation.png,
         compute-dgx-gb300/media/nvidia-dgx-gb300-rack-rear-exploded.png,
         compute-dgx-gb300/media/nvidia-blog-gb200-nvl72-ocp-submission-highlights.png,
         compute-dgx-gb300/media/cheval-orv3-mgx-rack-with-132mm-extension.png,
         compute-dgx-gb300/media/nvidia-hotchips2025-norton-gb200-gb300-case-study.pdf,
         compute-dgx-gb300/media/lenovo-gb300-nvl72-user-guide.pdf]
  notes: compute-dgx-gb300/README.md "Rack" table + "Rack rear"

nvidia-dgx-gb300-compute-tray:          # 1U, 4 x B300 + 2 x Grace, liquid + air cooled, 29 kg
  size: [438, 43.6, 766]                # 483 W across the EIA flanges/handles; 799 D including rear QDs (Lenovo)
  front: >
    Champagne-bronze faceplate (#85765C est, highlights #B5A58A) with bent-loop handle at each end (x 0-0.075 and
    0.935-1.0). Left square-hole module: 2 XDR OSFP cages x 0.103-0.150 / 0.193-0.240 (y 0.62-0.875) + in-band RJ45
    x 0.272-0.308. E1.S block x 0.347-0.590 (8 slots, 4 pairs). Front-IO board x 0.60-0.66 (BMC RJ45 x 0.602-0.629,
    USB, DP, LEDs). Right BlueField module x 0.669-0.93: BF BMC RJ45 x 0.715-0.751 + 2 QSFP x 0.785-0.868 (y 0.13-0.38),
    2 XDR OSFP x 0.700-0.746 / 0.788-0.834 (y 0.62-0.87). 4 OSFP cages are black, empty in the render.
  rear: >
    Light-silver plate (#D4D6D8). Seen from the rear: coolant OUTLET QD far left (x 0.04, ~20 mm round, y 0.37);
    4 blind-mate NVLink blocks x 0.095-0.234, 0.262-0.408, 0.579-0.727, 0.751-0.900 (black housings, y 0.15-0.87);
    DC busbar clip at centre x 0.458-0.524 (full height); coolant INLET QD far right (x 0.96).
  leds: {power: green, uid: blue, fault: amber, nvlink_health: green}
  weight_kg: 29
  refs: [compute-dgx-gb300/media/nvidia-dgx-gb300-compute-tray-front.png,
         compute-dgx-gb300/media/nvidia-dgx-gb300-compute-tray-iso.png,
         compute-dgx-gb300/media/nvidia-dgx-gb300-compute-tray-top.png,
         compute-dgx-gb300/media/nvidia-dgx-spod-gb300-ra.pdf,
         compute-dgx-gb300/media/lenovo-gb300-nvl72-product-guide-lp2357.pdf]
  notes: "compute-dgx-gb300/README.md 'Compute tray front / rear'. NVIDIA DGX-branded mm dimensions NOT FOUND (Lenovo 7DLZ values)."

nvidia-dgx-gb300-nvlink-switch-tray:    # 1U, 2 x NVLink switch chips, fully liquid-cooled, 17 kg, NO front data ports
  size: [438, 43.6, 770]                # 483 W across handles
  front: >
    Same champagne faceplate (#85765C est) and handles (x 0-0.058 / 0.94-1.0). Left module only: power/reset/ID LEDs
    at x 0.085/0.105/0.127 (y ~0.25), status + 4 NVLink LEDs x 0.154-0.186, USB-A x 0.278-0.305; RJ45 row y 0.57-0.85:
    console x 0.081-0.114, BMC x 0.127-0.163, ComE1 x 0.175-0.212, ComE0 x 0.225-0.261, leak-detect x 0.275-0.309.
    Right 60 % (x 0.332-0.935) is a blank champagne panel with a pull tab at x ~0.93, y 0.28-0.75.
  rear: >
    Same as the compute tray: return QD left, 2 + 2 blind-mate cartridge connector blocks, busbar clip centre,
    supply QD right (Lenovo LUG Fig 8). Top view shows a silver lid, hot outlet top-left, cold inlet bottom-left.
  leds: {power: green, status: green/amber, nvlink_health: green}
  weight_kg: 17
  refs: [compute-dgx-gb300/media/nvidia-dgx-spod-gb300-ra.pdf,
         compute-dgx-gb300/media/nvidia-dgx-gb300-nvlink-switch-tray-top.png,
         compute-dgx-gb300/media/lenovo-gb300-nvl72-user-guide.pdf]
  notes: "compute-dgx-gb300/README.md 'NVLink switch tray front'. RA Fig 6 (PDF p.11) is the only front view; no DGX mm dimensions (Lenovo 7DJY)."

nvidia-dgx-gb300-power-shelf:           # 1U, 6 x 5.5 kW = 33 kW, 50 V DC to the busbar; 8 per DGX rack (4 top, 4 bottom)
  size: [448, 43.6, 718.5]              # Lenovo LP p.36 (same as facility/README.md §6); weight NOT FOUND
  front: >
    All black (#2E2E2E est). Ears x 0-0.06 and 0.95-1.0. PMC board x 0.06-0.10 with one RJ45 (x 0.069-0.092, y 0.29-0.64)
    and a red reset pin (x 0.085, y 0.79). Six PSU modules at x centres 0.169, 0.308, 0.448, 0.589, 0.73, 0.876,
    each ~0.135 wide, round fan behind square-hole mesh, two green LEDs top-left, black pull handle on the right edge.
  rear: >
    Seen from the rear: 7-pin AC whip connector x 0.17-0.31; 50 V busbar connector centre x 0.46-0.52; 2 stacked
    RJ45 (daisy-chain / current sharing) x 0.86-0.89.
  leds: {psu_power: green, psu_health: green/amber, pmc: green/amber}
  refs: [compute-dgx-gb300/media/nvidia-dgx-gb-power-shelf-front.png,
         compute-dgx-gb300/media/lenovo-gb300-nvl72-user-guide.pdf,
         facility/media/lenovo-gb300-nvl72-rack-front-p6.jpg]
  notes: "compute-dgx-gb300/README.md 'Power shelf'. Weight NOT FOUND."

nvidia-q3400-rd:                        # Quantum-X800 144 x 800G XDR (72 twin OSFP cages), 4U, DC/busbar powered (= Q3401-RD, inferred)
  size: [438, 175, 852]                 # Q3401-RD 175 x 438 x 852, 57.2 kg; Q3400-RA is 177.8 x 438 x 850, 60 kg
  front: >
    Black faceplate (#202121 est in the RA figure; light gold #DBBC93 in the newer doc render). 3 groups x 4 cage-columns
    at x 0.145-0.361 / 0.396-0.611 / 0.646-0.861; 3 tiers x 2 rows at y 0.087-0.169 & 0.192-0.272, 0.411-0.498 & 0.517-0.603,
    0.741-0.820 & 0.843-0.922 = 72 twin-port cages; square-hole vent bands between tiers. Single FNM (UFM) OSFP at
    x 0.052-0.107, y 0.85-0.93; USB-A + console + 2 RJ45 bottom-right x 0.89-0.96, y 0.79-0.92.
  rear: >
    RD: 8 black fan modules (2 rows x 4; x 0.013-0.20, 0.21-0.395, 0.61-0.79, 0.805-0.99) with teal LEDs, centre block
    x 0.40-0.60 with one DC busbar connector (x 0.47-0.53, y 0.16-0.39). No PSUs. (RA variant: 4 PSUs each end + 10 fans.)
  airflow: "spec says 'Reverse air flow'; direction NOT FOUND"
  power: {max_w: 6327, dc: "48-54 V", typical_w: NOT FOUND}
  noise_dba: 78.4
  weight_kg: 57.2
  refs: [compute-dgx-gb300/media/nvidia-q3401-rd-front.png,
         compute-dgx-gb300/media/nvidia-q3401-rd-rear.png,
         compute-dgx-gb300/media/nvidia-q3400-ra-front.png,
         compute-dgx-gb300/media/nvidia-q3400-ra-rear.png,
         compute-dgx-gb300/media/nvidia-dgx-spod-gb300-ra.pdf]
  notes: "compute-dgx-gb300/README.md 'Q3400-RD'. RA prints 'Q3400-RD' (Fig 10, PDF p.21) but NVIDIA's hardware manual names the DC part Q3401-RD."

nvidia-sn5600:                          # Spectrum-4, 2U, 64 x 800G OSFP + 1 SFP28; the RA names the DC variant SN5600D
  size: [438, 88, 781]                  # SN5600D 88 x 438 x 781 (853 with busbar plug), 18.5 kg; AC SN5600 is 720 D (745 with fan levers), 23.5 kg
  front: >
    Black perforated faceplate (#202121 est; champagne end ears #857A60 in the RA figure). 4 groups x 4 cell-columns
    at x 0.05-0.273 / 0.28-0.495 / 0.503-0.715 / 0.7225-0.9375; two cell rows y 0.17-0.52 and 0.59-0.92, each cell =
    2 stacked OSFP cages (16 x 2 x 2 = 64). SFP28 #65 x 0.01-0.05, y 0.59-0.70; USB-A x 0.945; 2 stacked RJ45 (MGT,
    console) x 0.96-0.99, y 0.35-0.65; LED/button cluster top-right.
  rear: >
    D: 4 black fan modules (x 0.022-0.208, 0.218-0.39, 0.59-0.77, 0.78-0.965), centre panel x 0.41-0.59 with one DC busbar
    plug (x 0.46-0.54, y 0.01-0.47). AC SN5600: PSU at each end (C20-style inlet, green LED) + 4 fans with champagne pull bars.
  power: {dc: "48 V (40-60)", typical_w: 940, max_w: NOT FOUND}
  weight_kg: 18.5
  noise_dba: NOT FOUND
  airflow: NOT FOUND
  refs: [compute-dgx-gb300/media/nvidia-sn5600d-front.png,
         compute-dgx-gb300/media/nvidia-sn5600d-rear.png,
         compute-dgx-gb300/media/nvidia-sn5600-front.png,
         compute-dgx-gb300/media/nvidia-sn5600-rear.png]
  notes: "compute-dgx-gb300/README.md 'SN5600 / SN5600D'. Replaces mellanox-sn4600c-style 2U entries for the 800G leaves."

