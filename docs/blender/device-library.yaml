# Cooling (reference/cooling-schneider/README.md §6 "Blender modelling notes"). Vendor
# dimensions are cited there; anything a datasheet does not give is NOT FOUND + the estimate.

motivair-chilleddoor-m8-48u-600:        # active RDHx on every row-A and gb-mgmt rack (spec cooling.loops.rdhx)
  size: [600, 2258, 363]                # W = rack width; D = "Depth 14.3" in (CD25); H NOT FOUND -> assumed = rack height
  mount: rear-door                      # replaces the rack's rear door on an interface frame (IOM); hinged, closed in the render
  hinge: "physical side NOT FOUND (IOM: hose cut-out on the hinged side). CHOICE: hinge on the LEFT seen from the rear, latch + stainless control strip on the right"
  swing_deg: 95                         # CD25 "95-degree door swing" (IOM: 0-90)
  fans: {count: 5, layout: "vertical column behind the mesh", max_w: 840}
  coil: "aluminium-finned copper, full-face behind a perforated mesh; blue LED glow inside (normal), red = alarm (CRAY p.4)"
  hoses: {bore_in: 1, connections: top, colour: "#111111", coupling: "#B0B4B8"}   # MOT hoses page; top feed (QS)
  body: {colour: "#151517", finish: matt powder coat, roughness: 0.5}                # est
  control_strip: {colour: "#B9BCC0", width_frac: 0.25, hmi: "#101012"}             # brushed stainless door on the latch side (est)
  weight_kg: NOT FOUND
  refs: [cooling-schneider/media/motivair-chilleddoor-render.jpg,
         cooling-schneider/media/motivair-chilleddoor-brochure-se-2025.pdf,
         cooling-schneider/media/motivair-chilleddoor-hoses.png]

nvidia-nvl72-coolant-manifold:          # the NVL72 rack's own rear supply/return manifolds (2 vertical strips) + QDs
  size: [600, 1900, 60]                 # strips ~1900 H (est, GB300 pack "Manifolds"); pipe diameter NOT FOUND -> 60 mm est
  mount: rear-manifold
  strips: {left_frac: 0.11, right_frac: 0.885, note: "from the rear: LEFT = return/hot, RIGHT = supply/cold (inferred from tray QD sides)"}
  hose_connections: "4 x FD83 (2 per manifold), top-feed here (spec); knob centres at x ~0.36 / ~0.64 of the rack width"
  colour: "#B8BCC0"                     # stainless per the Lenovo spec (NVIDIA renders show black #1E1E20) — CHOICE: stainless
  qd: {per_tray: 2, colour: "#C9CCD0"}
  refs: [compute-dgx-gb300/media/lenovo-gb300-nvl72-user-guide.pdf, compute-dgx-gb300/media/nvidia-dgx-gb300-rack-rear-exploded.png]

