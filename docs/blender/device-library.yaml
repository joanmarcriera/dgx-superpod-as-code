# Device library for the Blender build — physical envelope, look and references per
# device-type slug used in docs/scene.json. Curated from reference/<pack>/README.md
# ("Blender modelling notes"). Dimensions are mm as W × H × D (depth front-to-back).
# Colours marked "est" are visual estimates from vendor figures, not vendor specs.
# `refs` paths are relative to reference/ (media is local-only; rebuild with fetch.py).

rack:                                   # APC NetShelter SX AR3307B2 (AR3307 successor)
  size: [600, 2258, 1200]
  u1_from_floor: 100                    # = spec racks.rack_u0_mm default; plinth/casters
  rails: {width_in: 19, colour: "#9A9DA0"}
  body: {colour: "#1B1B1D", finish: matt powder coat, roughness: 0.5}
  doors: none                           # DCG: doors not recommended; side panels ON
  blanking_panels: {colour: "#1B1B1D", everywhere_empty: true}
  refs: [facility/media/nvidia-dcg-h100-fig12-cabinet-dimensions.png,
         facility/media/commons-datacenter-server-racks-row.jpg]
  notes: facility/README.md "Blender modelling notes"

nvidia-dgx-h200:                        # 8U, 130.45 kg
  size: [482.3, 356, 897.1]
  front: >
    Champagne/tan ears and bezel frame (#B5A58A est); recessed metal-foam face
    (#6B5636 with #CDBFA5 highlights, reads dark olive-bronze) spanning x 0.06–0.95;
    tall rounded NVIDIA logo pad at x 0.075–0.22 (logo rotated 90°; OMIT the logo on
    published renders unless approved); power/UID/fault LEDs on the right ear at y 0.21/0.27/0.325.
  rear: >
    Top 60 %: GPU tray with light-silver hex-perforated exhaust grille (#D4D6D8).
    y 0.60–0.86: motherboard tray — 4 twin-port OSFP cages in one row at x 0.37–0.61
    (flat-top MMA4Z00-NS-FLT transceivers, 2 aqua fibres each), dual-port QSFP112 cards
    left (x 0.02–0.31) and right (x 0.62–0.90), BMC RJ45 at x 0.38 on the bottom strip.
    Bottom row y 0.875–0.995: 6 PSUs across the width, black C20 inlets, yellow-green
    release tabs (#B5D335).
  leds: {power: green, uid: blue, fault: amber}
  refs: [compute-dgx-h200/media/dgx-h100-h200-front-with-bezel.png,
         compute-dgx-h200/media/dgx-h100-h200-front-bezel-removed.png,
         compute-dgx-h200/media/dgx-h100-h200-rear-panel-modules.png,
         compute-dgx-h200/media/nvidia-dgx-bezel-metal-foam-texture.jpg]
  notes: compute-dgx-h200/README.md "Blender modelling notes" (fractions ±0.02)

nvidia-qm9700:                          # Quantum-2 NDR IB, 1U, 64 × 400G in 32 OSFP cages
  size: [438, 43.6, 660]
  front: "Black bezel (#1A1A1A est); two rows of 16 OSFP cages (#3A3F44); finned-top twin OSFP transceivers with 2 aqua MPO fibres each in used cages."
  rear: "PSU at each end (C14, blue latch), 7 fan modules between with tan pull labels (#C8A400 est); airflow dots blue (-F, P2C)."
  refs: [network/media/qm9700-doc-img1.png, network/media/qm9700-doc-img4.png]
  notes: network/README.md §1

mellanox-sn4600c:                       # Spectrum 100GbE, 2U, 64 × QSFP28
  size: [428, 88, 566]
  front: "Black perforated bezel (#15171A est); 2 rows of 16 double-stacked QSFP28 blocks; MGT/console RJ45 far right; small status LEDs left."
  rear: "PSU each end, 3 large fan modules with blue latches (#2B44C8 est)."
  refs: [network/media/sn4600c-doc-front.png, network/media/sn4600c-doc-rear.png]
  notes: network/README.md §2 (also used for the VAST backend pair)

nvidia-sn2201:                          # 1GbE OOB, 1U, 48 × RJ45 + 4 × QSFP28 (Cat5e, grey)
  size: [428, 43.9, 432]
  front: "Dark grey (#2B2F33 est); 48 RJ45 in 2 rows; 4 QSFP28 uplinks right."
  refs: [network/media/sn2201-doc-front.png, network/media/sn2201-doc-rear.png]

nvidia-ufm-appliance-3-1:               # UFM Enterprise Appliance 3.1 (MUA960B), 1U
  size: [482, 42.8, 809]
  front: "Black 1U server chassis with silver edge (#1C1C1E est), drive bays, status LEDs."
  refs: [network/media/ufm-ent-appliance-front.png]
  notes: "Rear image not found — model a generic 1U server rear with 2 ConnectX-7 OSFP cards."

dell-poweredge-r750:                    # BCM head nodes / Slurm, 2U
  size: [482, 86.8, 758]                # Dell spec values, NOT in the reference packs — verify
  front: "Black bezel with Dell honeycomb grille, 2.5\" drive bays behind."
  notes: "Not researched in depth; keep it plain."

ddn-ai400x2t:                           # tier-1 storage, 2U
