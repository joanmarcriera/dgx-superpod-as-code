# Generic RoCEv2 high-performance storage appliance for the GB300 Ethernet storage leaves
# ("Storage is provided over RDMA over Converged Ethernet", RA-GB300). Vendor-neutral,
# like the RA. CHOICE: 4 x 400G, 2U, power as the DCG "typical" storage (3,600 W peak).
manufacturer: Generic
model: HPS Ethernet Appliance 2U
slug: generic-hps-ethernet-appliance-2u
u_height: 2
is_full_depth: true
airflow: front-to-rear
interfaces:
  - {name: "eth{1..4}", type: 400gbase-x-qsfp112}
  - {name: "mgmt{1..2}", type: 1000base-t, mgmt_only: true}
power-ports:
  - {name: psu1, type: iec-60320-c14, maximum_draw: 3600, allocated_draw: 1800}
  - {name: psu2, type: iec-60320-c14, maximum_draw: 3600, allocated_draw: 1800}
