# NVL72 power shelf (8 per rack) — custom. RA-GB300 "DGX Power Shelves": "six 5.5kW PSUs
# configured as N redundant and can deliver up to 33kW"; front BMC RJ45. Its AC inlet is
# fed by one 415 V / 63 A 3-phase feed (CHOICE: ~45 kVA covers 33 kW). The DC output feeds
# the rack busbar, which NetBox cannot cable one-to-many, so tray draw is carried on the
# trays' own DC-IN ports; the inlet has no allocated_draw to avoid double counting. CHOICE: 1U.
manufacturer: Nvidia
model: DGX GB300 Power Shelf 33kW
slug: nvidia-dgx-gb300-power-shelf
u_height: 1
is_full_depth: true
interfaces:
  - {name: BMC, type: 1000base-t, mgmt_only: true}
power-ports:
  - {name: AC-IN, type: iec-60309-3p-n-e-6h, maximum_draw: 33000}
