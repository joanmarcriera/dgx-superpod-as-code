# eth0 is the management port but upstream does not flag it mgmt_only; no power ports.
# Power: DCG DG-11301-001 Table 4, SN2201 peak 135 W / avg 98 W; allocated_draw = peak / 2 PSUs.
update:
  interfaces:
    eth0: {mgmt_only: true}
add:
  power-ports:
    - {name: psu1, type: iec-60320-c14, maximum_draw: 135, allocated_draw: 68}
    - {name: psu2, type: iec-60320-c14, maximum_draw: 135, allocated_draw: 68}
